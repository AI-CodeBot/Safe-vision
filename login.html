<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#20332e" />
    <title>Sign in · SafeVision AI</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #202b28; background: #f4f5f1; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 390px); padding: 32px; border: 1px solid #e2e6df; border-radius: 8px; background: #fff; box-shadow: 0 16px 48px #20332e12; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 24px; color: #68756d; line-height: 1.5; }
      label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
      input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #cdd5cb; border-radius: 4px; font: inherit; }
      button { width: 100%; min-height: 44px; margin-top: 16px; border: 0; border-radius: 4px; color: white; background: #174b3b; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      #message { min-height: 20px; margin: 14px 0 0; color: #a12f27; font-size: 13px; }
      input:focus-visible, button:focus-visible { outline: 3px solid #9dc86c; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign in to SafeVision</h1>
      <p>Enter the access password configured by the administrator.</p>
      <form id="login-form">
        <label for="password">Access password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button type="submit">Sign in</button>
        <p id="message" role="alert" aria-live="polite"></p>
      </form>
    </main>
    <script>
      const form = document.querySelector("#login-form");
      const message = document.querySelector("#message");
      const button = form.querySelector("button");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";
        button.disabled = true;
        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ password: form.elements.password.value }),
          });
          if (!response.ok) {
            const result = await response.json().catch(() => ({}));
            throw new Error(result.detail || "Sign-in failed. Check the password and try again.");
          }
          window.location.replace("/");
        } catch (error) {
          message.textContent = error.message || "Could not reach SafeVision.";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
